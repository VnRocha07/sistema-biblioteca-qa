name: Smoke

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -q pytest pytest-cov
      - name: Bloquear segredos
        run: |
          if git ls-files | grep -qiE '\.env$|\.pem$|\.key$|credentials'; then
            echo "::error::credencial versionada"; exit 1; fi
      - name: Teste de fumaca
        run: pytest -q
